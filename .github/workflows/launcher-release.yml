# peg2arm: builds the optional launcher (launcher/, original code, no art) and attaches it to a GitHub release.
# Runs for tags named peg2arm-v* (and by hand). The Peggle 2 app itself is never built here: it is made from each
# user's own copy of the game (install/peg2arm-setup.bat).
#
# Signing: with the repository secrets LAUNCHER_KEYSTORE_BASE64 (a .jks/.keystore, base64) and
# LAUNCHER_KEYSTORE_PASSWORD, releases are signed with that key, so each one installs over the last. Without them a
# throwaway debug key is made (a new key every run: uninstall the old launcher before installing).
name: launcher release

on:
  push:
    tags: ['peg2arm-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Android SDK pieces
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;36.0.0' 'platforms;android-36' > /dev/null
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.LAUNCHER_KEYSTORE_BASE64 }}
        run: |
          mkdir -p out
          if [ -n "$KEYSTORE_B64" ]; then echo "$KEYSTORE_B64" | base64 -d > out/release.keystore; fi
      - name: Build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.LAUNCHER_KEYSTORE_PASSWORD }}
        run: |
          args="--sdk $ANDROID_HOME --build-tools 36.0.0 --platform android-36 --jdk $JAVA_HOME --out out/launcher/peggle_launcher.apk"
          if [ -f out/release.keystore ]; then args="$args --keystore out/release.keystore --store-pass-env KEYSTORE_PASSWORD"; fi
          python3 launcher/build_launcher.py $args
      - uses: actions/upload-artifact@v4
        with:
          name: peggle_launcher
          path: out/launcher/peggle_launcher.apk
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file docs/release-notes.md
          gh release upload "$GITHUB_REF_NAME" out/launcher/peggle_launcher.apk --clobber
